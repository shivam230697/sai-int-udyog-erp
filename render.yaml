databases:
  - name: sai-int-udyog-db
    plan: free
    databaseName: sai_int_udyog
    user: sai_int_udyog

services:
  - type: web
    name: sai-int-udyog-erp
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py makemigrations core && python manage.py migrate && python manage.py collectstatic --no-input && python manage.py createsuperuser --noinput --username \"$DJANGO_SUPERUSER_USERNAME\" --email \"$DJANGO_SUPERUSER_EMAIL\""    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sai-int-udyog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
