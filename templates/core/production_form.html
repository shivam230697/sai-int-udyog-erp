
{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="mb-4">
        <h2>Record Production</h2>
        <p class="text-muted">Enter the details of a production batch.</p>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Production
                </button>

                <a href="{% url 'production-list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
