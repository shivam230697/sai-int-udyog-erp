<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Sai Int Udyog ERP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f6f8}.login-card{max-width:420px;border:0;border-radius:1.2rem;box-shadow:0 12px 40px #1f29370f}.brand-mark{background:#9f432b;color:white;border-radius:.6rem;padding:.4rem .65rem;font-weight:800}</style></head>
<body><div class="container min-vh-100 d-flex align-items-center justify-content-center py-5"><div class="card login-card w-100 p-4 p-md-5"><div class="d-flex align-items-center gap-3 mb-4"><span class="brand-mark">SI</span><div><h4 class="mb-0">Sai Int Udyog</h4><div class="text-secondary small">Manufacturing ERP</div></div></div>
<h2 class="h4 fw-bold">Welcome back</h2><p class="text-secondary">Sign in to manage your brick factory.</p>
{% if form.errors %}<div class="alert alert-danger">Username or password is incorrect.</div>{% endif %}
<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label><input class="form-control form-control-lg" name="username" required autofocus></div><div class="mb-4"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" required></div><button class="btn btn-dark btn-lg w-100">Sign in</button></form>
</div></div></body></html>
